name: Concierge offline safety CI
on:
  pull_request:
  push:
    branches:
      - build-001-shared-concierge
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dependency-free tests
        run: npm test
      - name: Verify no external runtime dependencies
        run: |
          test ! -d node_modules
          test ! -e .env
          grep -q "connect-src 'none'" demo/index.html
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary test-only Chromium tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test desktop and mobile UI without external requests
        run: node tests/browser-smoke.cjs
      - name: Archive test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concierge-browser-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
